name: "✨ Feature Request"
description: Suggest a new MCP tool, integration, or improvement for Substak-MCP.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! The more concrete the use case, the easier it is to prioritize.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user / workflow problem. Avoid jumping straight to a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A clear description of the MCP tool, prompt, or behavior you would like to see.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Publishing / drafts
        - Scheduling
        - Analytics
        - Public research
        - Content strategy
        - MCP client integration
        - Developer experience
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered or existing workarounds.
  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues and discussions for similar requests.
          required: true
        - label: This request respects Substack's terms of service.
          required: true
